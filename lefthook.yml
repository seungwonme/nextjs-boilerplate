pre-commit:
  parallel: false
  commands:
    biome-check:
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

    prevent-env:
      glob: ".env*"
      exclude: ".env.example"
      run: |
        echo "ERROR: .env files cannot be committed. Use .env.example."
        exit 1

    staged-diff:
      run: git diff --cached --check

    detect-private-key:
      run: |
        if git diff --cached --no-ext-diff --unified=0 | rg -q -- '^\+.*-----BEGIN (RSA|DSA|EC|OPENSSH|PGP) PRIVATE KEY-----'; then
          echo "ERROR: staged files contain a private key."
          exit 1
        fi
